{% extends "base.html" %}
{% block body %}
    <div class="container">
        <h1>Todo Form</h1>
        <form method="POST">
            {% csrf_token %}
            <div class="col mt-4">
                <div class="row"><label>{{ form.title.label }}</label></div>
                <div class="row">{{ form.title }}</div>
            </div>
            <div class="col mt-4">
                <div class="row"><label>{{ form.email.label }}</label></div>
                <div class="row">{{ form.email }}</div>
            </div>
            <div class="col mt-4">
                <div class="row"><label>{{ form.description.label }}</label></div>
                <div class="row">{{ form.description }}</div>
            </div>
            <div class="col mt-4 mb-4">
                <div class="row"><label>{{ form.completion_status.label }}</label></div>
                <div class="row">{{ form.completion_status }}</div>
            </div>
            <input type="submit" value="submit" class="btn btn-primary">
        </form>
    </div>
{% endblock body %}
